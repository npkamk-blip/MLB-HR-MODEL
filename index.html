<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncle Nicky · MLB HR Model</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --cream:   #F5F0E8;
  --cream2:  #EDE8DF;
  --cream3:  #E4DDD2;
  --inset:   #DDD6CA;
  --card:    #F8F4EE;
  --orange:  #C84B11;
  --orange2: #E05A1A;
  --orange-pill: rgba(200,75,17,0.12);
  --charcoal:#1C1C1E;
  --text:    #2C2825;
  --muted:   #6B6560;
  --muted2:  #9B9390;
  --border:  rgba(44,40,37,0.10);
  --border2: rgba(44,40,37,0.06);
  --g:       #2D7A3A;
  --g-light: rgba(45,122,58,0.10);
  --r:       #C0392B;
  --r-light: rgba(192,57,43,0.10);
  --shadow:  inset 0 2px 8px rgba(0,0,0,0.08), inset 0 1px 3px rgba(0,0,0,0.05);
  --shadow-out: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--cream);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: var(--text);
  letter-spacing: -0.3px;
}
.logo span { color: var(--orange); }
.header-right { display: flex; align-items: center; gap: 10px; }
.refresh-btn {
  background: var(--orange);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: background 0.15s;
}
.refresh-btn:hover { background: var(--orange2); }
.date-badge {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--cream);
  padding: 0 20px;
  gap: 0;
}
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s;
  letter-spacing: 0.2px;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--orange);
  border-bottom-color: var(--orange);
  font-weight: 600;
}

/* ── Main content ── */
.main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Dashboard ── */
.dash-section { margin-bottom: 28px; }
.dash-title {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--text);
  margin-bottom: 14px;
  letter-spacing: -0.2px;
}
.top8-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
@media(max-width: 900px) { .top8-grid { grid-template-columns: repeat(2,1fr); } }
@media(max-width: 480px) { .top8-grid { grid-template-columns: 1fr; } }

.pick-card {
  background: var(--card);
  border-radius: 10px;
  padding: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border2);
  position: relative;
}
.pick-rank {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted2);
}
.pick-pct {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: var(--orange);
  font-weight: 400;
  text-align: right;
  line-height: 1;
  margin-bottom: 4px;
}
.pick-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-top: 16px;
  line-height: 1.2;
}
.pick-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.pick-source {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  margin-top: 5px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.pick-source.confirmed { background: var(--g-light); color: var(--g); }
.pick-source.projected { background: rgba(155,147,144,0.15); color: var(--muted); }

/* ── History ── */
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-row {
  background: var(--card);
  border-radius: 8px;
  border: 1px solid var(--border2);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.history-header {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  cursor: pointer;
  gap: 12px;
  transition: background 0.1s;
}
.history-header:hover { background: var(--cream2); }
.history-date { font-size: 13px; font-weight: 600; color: var(--text); min-width: 80px; }
.history-rate {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--orange);
}
.history-rate-label { font-size: 11px; color: var(--muted); margin-left: 4px; }
.history-chevron { margin-left: auto; font-size: 11px; color: var(--muted2); transition: transform 0.2s; }
.history-chevron.open { transform: rotate(180deg); }
.history-body {
  display: none;
  padding: 0 14px 12px;
  border-top: 1px solid var(--border2);
}
.history-body.open { display: block; }
.history-players { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; }
.history-player {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text);
  background: var(--cream);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 4px 8px;
}
.hist-check { font-size: 13px; }
.hist-check.hit { color: var(--g); }
.hist-check.miss { color: var(--r); }
.hist-check.pending { color: var(--muted2); }

/* ── Batters Tab ── */
.slate-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 14px;
  font-size: 12px;
  color: var(--muted);
}
.slate-bar strong { color: var(--orange); font-weight: 700; }
.last-updated { font-size: 11px; color: var(--muted2); }

/* ── Game Card ── */
.game-card {
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--border2);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
}
.game-grid {
  display: grid;
  grid-template-columns: 200px 80px 80px 1fr 1fr;
  min-height: 120px;
}
@media(max-width: 768px) {
  .game-grid { grid-template-columns: 1fr; }
  .game-col-info, .game-col-proj, .game-col-wind { display: none; }
}

.game-col {
  padding: 12px 10px;
  border-right: 1px solid var(--border2);
}
.game-col:last-child { border-right: none; }
.game-col-info { padding: 14px 14px; }

.game-time { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.game-teams { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 8px; }
.game-teams .vs { color: var(--muted2); font-weight: 400; font-size: 11px; }

.pitcher-row { margin-bottom: 5px; }
.pitcher-name { font-size: 12px; font-weight: 600; color: var(--text); }
.pitcher-hand {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  margin-left: 4px;
  background: rgba(200,75,17,0.12);
  color: var(--orange);
  letter-spacing: 0.5px;
}
.pitcher-splits { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pitcher-splits span { color: var(--orange); font-weight: 600; }

.proj-hrs {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  color: var(--orange);
  line-height: 1;
  text-align: center;
}
.proj-hrs-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
.proj-hrs-split { font-size: 10px; color: var(--muted2); text-align: center; }
.env-badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 6px;
  letter-spacing: 0.5px;
  text-align: center;
  width: 100%;
}
.env-ideal { background: var(--g-light); color: var(--g); }
.env-good  { background: rgba(45,122,58,0.07); color: var(--g); }
.env-normal{ background: rgba(155,147,144,0.12); color: var(--muted); }
.env-tough { background: var(--r-light); color: var(--r); }

.wind-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.wind-label { font-size: 11px; color: var(--muted); text-align: center; }
.wind-arrow { font-size: 20px; }

/* ── Batter table ── */
.batter-section { padding: 0; }
.batter-header {
  display: grid;
  grid-template-columns: 20px 1fr 50px 38px 36px 50px;
  gap: 0;
  padding: 6px 10px;
  border-top: 1px solid var(--border2);
  border-bottom: 1px solid var(--border2);
  background: var(--cream2);
}
.batter-header span {
  font-size: 9px;
  font-weight: 700;
  color: var(--muted2);
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.batter-header span:not(:first-child):not(:nth-child(2)) { text-align: right; }
.batter-row {
  display: grid;
  grid-template-columns: 20px 1fr 50px 38px 36px 50px;
  gap: 0;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border2);
  cursor: pointer;
  transition: background 0.1s;
  align-items: center;
}
.batter-row:last-child { border-bottom: none; }
.batter-row:hover { background: var(--cream2); }
.batter-row.expanded { background: var(--cream2); }

.bat-order { font-size: 10px; color: var(--muted2); font-weight: 500; }
.bat-name { font-size: 13px; font-weight: 600; color: var(--text); }
.bat-name.top25 { color: var(--orange); }

.stat-val { font-size: 12px; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.stat-val.muted { color: var(--muted2); }

.pct-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  float: right;
}
.pct-elite { background: rgba(200,75,17,0.15); color: var(--orange); }
.pct-high  { background: rgba(200,75,17,0.09); color: var(--orange); }
.pct-mid   { background: rgba(44,40,37,0.07); color: var(--text); }
.pct-ok    { color: var(--muted); background: transparent; }
.pct-low   { color: var(--muted2); background: transparent; }

.top25-pill {
  background: var(--orange-pill);
  border: 1px solid rgba(200,75,17,0.25);
}

/* ── Batter dropdown ── */
.batter-detail {
  display: none;
  padding: 14px;
  background: var(--cream2);
  border-bottom: 1px solid var(--border2);
}
.batter-detail.open { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 180px;
  gap: 16px;
}
@media(max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }

.detail-stats { }
.detail-stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid var(--border2);
  gap: 8px;
}
.detail-stat-row:last-child { border-bottom: none; }
.detail-stat-label { font-size: 11px; color: var(--muted); }
.detail-stat-val { font-size: 12px; font-weight: 600; color: var(--text); }
.median-tag {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
}
.med-up { background: var(--g-light); color: var(--g); }
.med-dn { background: var(--r-light); color: var(--r); }

/* ── Radar ── */
.radar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.radar-verdict {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  font-style: italic;
  line-height: 1.4;
}
.score-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  width: 100%;
}
.score-card {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}
.score-card-label { font-size: 9px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.score-card-val {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  line-height: 1.1;
}
.score-high { color: var(--g); }
.score-mid  { color: var(--orange); }
.score-low  { color: var(--r); }

/* ── More toggle ── */
.more-toggle {
  text-align: center;
  padding: 7px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: color 0.1s;
  border-top: 1px solid var(--border2);
}
.more-toggle:hover { color: var(--orange); }

/* ── Loading/Error ── */
.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
}
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--muted); }
.error-wrap {
  background: var(--r-light);
  border: 1px solid rgba(192,57,43,0.2);
  border-radius: 8px;
  padding: 14px 16px;
  color: var(--r);
  font-size: 13px;
  margin: 20px 0;
}
.no-data-wrap {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.no-data-wrap .icon { font-size: 32px; margin-bottom: 10px; }
.no-data-wrap p { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: var(--text); }
.no-data-wrap small { font-size: 12px; }

/* ── Lineup status ── */
.lineup-status {
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: inline-block;
  margin-bottom: 4px;
}
.status-confirmed { background: var(--g-light); color: var(--g); }
.status-projected { background: rgba(155,147,144,0.15); color: var(--muted); }

/* ── Section header ── */
.section-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--muted2);
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 6px 10px 4px;
  border-top: 1px solid var(--border2);
}

/* Final game row */
.final-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  opacity: 0.6;
  border-top: 1px solid var(--border2);
}
.final-badge {
  font-size: 9px;
  font-weight: 700;
  color: var(--g);
  background: var(--g-light);
  padding: 2px 5px;
  border-radius: 3px;
  letter-spacing: 0.5px;
}
.final-teams { font-size: 13px; color: var(--text); }
.final-pitchers { font-size: 11px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Uncle <span>Nicky</span></div>
  <div class="header-right">
    <span class="date-badge" id="dateLbl"></span>
    <button class="refresh-btn" onclick="refreshAll()">Refresh</button>
  </div>
</header>

<nav class="tabs">
  <div class="tab active" onclick="switchTab('dashboard',this)">Dashboard</div>
  <div class="tab" onclick="switchTab('batters',this)">Batters</div>
</nav>

<div class="main">

  <!-- DASHBOARD -->
  <div id="tab-dashboard" class="tab-pane active">
    <div class="dash-section">
      <div class="dash-title">Today's Top 8</div>
      <div id="top8-grid" class="top8-grid">
        <div class="loading-wrap"><div class="loading-spinner"></div><div class="loading-text">Loading picks…</div></div>
      </div>
    </div>
    <div class="dash-section">
      <div class="dash-title">Recent Record</div>
      <div id="history-list" class="history-list">
        <div class="loading-wrap"><div class="loading-spinner"></div><div class="loading-text">Loading history…</div></div>
      </div>
    </div>
  </div>

  <!-- BATTERS -->
  <div id="tab-batters" class="tab-pane">
    <div class="slate-bar">
      <span id="slate-info">Loading…</span>
      <span class="last-updated" id="last-updated"></span>
    </div>
    <div id="batters-main">
      <div class="loading-wrap"><div class="loading-spinner"></div><div class="loading-text">Loading games…</div></div>
    </div>
  </div>

</div>

<script>
var API = 'https://web-production-c0e4.up.railway.app';
var GITHUB_RAW = 'https://raw.githubusercontent.com/npkamk-blip/MLB-HR-MODEL/main';
var allGames = [];
var top25Names = new Set();

// ── Date ──
var today = new Date();
function todayStr(){
  var y=today.getFullYear(), m=String(today.getMonth()+1).padStart(2,'0'), d=String(today.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function fmtDateLabel(d){
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
document.getElementById('dateLbl').textContent = fmtDateLabel(today);

// ── Tab switching ──
function switchTab(name, el){
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='batters' && !allGames.length) loadBatters();
}

// ── Refresh ──
function refreshAll(){
  loadDashboard();
  if(document.getElementById('tab-batters').classList.contains('active')) loadBatters(true);
}

// ── Helpers ──
function fmtTime(iso){
  if(!iso) return '--';
  try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}); }
  catch(e){ return '--'; }
}
function fmtXslg(v){
  if(!v||v<=0) return '--';
  if(v>=1.0) return v.toFixed(3);
  return '.'+String(Math.round(v*1000)).padStart(3,'0');
}
function fmtPct(v){ return v>0 ? v.toFixed(1)+'%' : '--'; }
function pctCls(p){ return p>=15?'pct-elite':p>=11?'pct-high':p>=8?'pct-mid':p>=5?'pct-ok':'pct-low'; }
function brlCls(b){ return b>=12?'score-high':b>=7?'score-mid':'score-low'; }
function xslgCls(x){ return x>=0.600?'score-high':x>=0.450?'score-mid':'score-low'; }
function scoreCls(s){ return s>=65?'score-high':s>=40?'score-mid':'score-low'; }

var medians = {
  barrel_pct_season:10.7,hard_hit_season:43.5,ev_season:90,iso_season:0.167,
  la_season:14.1,pull_pct_season:40.4,barrel_pct_l8d:7.7,hard_hit_l8d:28.1,
  ev_l8d:84,bat_speed_l8d:70.3,xwoba_l8d:0.391,xslg_l8d:0.56,
  iso_vs_hand:0.181,pit_hr9_season:1.04,pit_hard_hit_season:40.4,
  pit_hr9_vs_hand:0.93,park_factor:1.05,pit_era_season:3.68,k_pct_l8d:21.6,
};

// ── Build top 25 set from predictions ──
async function buildTop25Set(){
  try {
    var r = await fetch(GITHUB_RAW+'/data/predictions/'+todayStr()+'.json?t='+Date.now());
    if(!r.ok) return;
    var data = await r.json();
    var sorted = data.sort(function(a,b){ return (b.model_hr_pct||0)-(a.model_hr_pct||0); });
    top25Names = new Set(sorted.slice(0,25).map(function(p){ return p.name; }));
  } catch(e){}
}

// ── DASHBOARD ──
async function loadDashboard(){
  await buildTop25Set();
  loadTop8();
  loadHistory();
}

async function loadTop8(){
  var el = document.getElementById('top8-grid');
  try {
    var r = await fetch(GITHUB_RAW+'/data/predictions/'+todayStr()+'.json?t='+Date.now());
    if(!r.ok) throw new Error('No predictions file');
    var data = await r.json();
    var sorted = data.sort(function(a,b){ return (b.model_hr_pct||0)-(a.model_hr_pct||0); });
    var top8 = sorted.slice(0,8);
    if(!top8.length){ el.innerHTML='<div class="no-data-wrap"><div class="icon">⚾</div><p>No picks yet</p><small>Check back after 8am ET</small></div>'; return; }
    el.innerHTML = top8.map(function(p,i){
      var pct = p.model_hr_pct||0;
      var src = p.lineup_source==='confirmed'?'confirmed':'projected';
      return '<div class="pick-card">'+
        '<div class="pick-rank">'+(i+1)+'</div>'+
        '<div class="pick-pct">'+pct.toFixed(1)+'<span style="font-size:14px;color:var(--muted)">%</span></div>'+
        '<div class="pick-name">'+p.name+'</div>'+
        '<div class="pick-meta">'+p.team+' · vs '+p.opp_pitcher+'</div>'+
        '<span class="pick-source '+src+'">'+src+'</span>'+
      '</div>';
    }).join('');
  } catch(e){
    el.innerHTML = '<div class="error-wrap">Could not load picks. <a href="#" onclick="loadTop8();return false" style="color:var(--orange)">Retry</a></div>';
  }
}

async function loadHistory(){
  var el = document.getElementById('history-list');
  var rows = [];
  var now = new Date();
  for(var i=1;i<=7;i++){
    var d = new Date(now); d.setDate(d.getDate()-i);
    var ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    try {
      var r = await fetch(GITHUB_RAW+'/data/predictions/'+ds+'.json?t='+Date.now());
      if(!r.ok) continue;
      var data = await r.json();
      var sorted = data.sort(function(a,b){ return (b.model_hr_pct||0)-(a.model_hr_pct||0); });
      var top8 = sorted.slice(0,8);
      var completed = top8.filter(function(p){ return p.hit_hr===0||p.hit_hr===1; });
      if(!completed.length) continue;
      var hits = completed.filter(function(p){ return p.hit_hr===1; }).length;
      rows.push({date:ds, label:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}), hits:hits, total:completed.length, players:top8});
    } catch(e){}
  }
  if(!rows.length){
    el.innerHTML='<div class="no-data-wrap"><div class="icon">📊</div><p>No history yet</p><small>Results appear after 4am ET</small></div>';
    return;
  }
  el.innerHTML = rows.map(function(row,idx){
    var pct = row.total>0?Math.round(row.hits/row.total*100):0;
    var playersHtml = row.players.map(function(p){
      var outcome = p.hit_hr===1?'hit':p.hit_hr===0?'miss':'pending';
      var icon = outcome==='hit'?'✓':outcome==='miss'?'✗':'·';
      return '<div class="history-player"><span class="hist-check '+outcome+'">'+icon+'</span><span>'+p.name+'</span><span style="color:var(--muted);font-size:11px">'+p.model_hr_pct.toFixed(1)+'%</span></div>';
    }).join('');
    return '<div class="history-row">'+
      '<div class="history-header" onclick="toggleHistory(\'hist-'+idx+'\',this)">'+
        '<span class="history-date">'+row.label+'</span>'+
        '<span class="history-rate">'+row.hits+'/'+row.total+'</span>'+
        '<span class="history-rate-label">('+pct+'%)</span>'+
        '<span class="history-chevron" id="chev-'+idx+'">▼</span>'+
      '</div>'+
      '<div class="history-body" id="hist-'+idx+'">'+
        '<div class="history-players">'+playersHtml+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleHistory(id, header){
  var body = document.getElementById(id);
  var chevIdx = id.replace('hist-','');
  var chev = document.getElementById('chev-'+chevIdx);
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);

async function loadBatters(force){
  var el = document.getElementById('batters-main');
  el.innerHTML = '<div class="loading-wrap"><div class="loading-spinner"></div><div class="loading-text">Loading games…</div></div>';

  // Build top25 set
  await buildTop25Set();

  // Try games file first
  var data = null;
  try {
    var r = await fetch(GITHUB_RAW+'/data/games/'+todayStr()+'.json?t='+Date.now());
    if(r.ok){
      var j = await r.json();
      if(j && j.games && j.games.length>0){ data = j; }
    }
  } catch(e){}

  // Fallback to API
  if(!data || force){
    try {
      var r2 = await fetch(API+'/games?date='+todayStr()+(force?'&refresh=true':''));
      if(r2.ok){
        var j2 = await r2.json();
        if(j2 && j2.games && j2.games.length>0){ data = j2; }
      }
    } catch(e){}
  }

  if(!data || !data.games || !data.games.length){
    el.innerHTML = '<div class="no-data-wrap"><div class="icon">⚾</div><p>No lineups yet for today</p><small>Games file saves at 8am ET · Confirmations post 10am-12pm ET</small></div>';
    document.getElementById('slate-info').textContent = 'No games loaded';
    return;
  }

  allGames = data.games;
  renderBatters(data);
}

function renderBatters(data){
  var games = data.games||[];
  var el = document.getElementById('batters-main');
  var projHRs = 0;
  games.forEach(function(g){ projHRs += (g.proj_hrs||0); });

  document.getElementById('slate-info').textContent = games.length+' games today';
  document.getElementById('last-updated').textContent = 'Updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

  // Separate final and active games
  var active = games.filter(function(g){ return !g.is_final; });
  var final  = games.filter(function(g){ return g.is_final; });

  var html = '';

  active.forEach(function(g, gi){
    html += buildGameCard(g, gi);
  });

  if(final.length){
    html += '<div style="margin-top:20px;margin-bottom:6px;font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;">Completed Games</div>';
    final.forEach(function(g){
      html += '<div class="final-row">'+
        '<span class="final-badge">FINAL</span>'+
        '<span class="final-teams">'+g.away+' @ '+g.home+'</span>'+
        '<span class="final-pitchers">'+(g.away_pitcher&&g.away_pitcher.name?g.away_pitcher.name:'TBD')+' vs '+(g.home_pitcher&&g.home_pitcher.name?g.home_pitcher.name:'TBD')+'</span>'+
      '</div>';
    });
  }

  el.innerHTML = html;
}

function buildGameCard(g, gi){
  var awayP = g.away_pitcher||{};
  var homeP = g.home_pitcher||{};
  var time  = fmtTime(g.time);
  var awayStatus = g.lineup_away_status||'projected';
  var homeStatus = g.lineup_home_status||'projected';

  // Pitcher splits
  function pitSplits(p){
    if(!p||!p.name||p.name==='TBD') return '<span style="color:var(--muted2);font-size:11px">TBD</span>';
    var vs = p.hand==='L'?'vs RHH':'vs LHH';
    // Use HR/9 vs the opposing batters handedness
    // away pitcher faces home batters - need vs hand from game context
    var hr9  = p.hr9||0;
    var vsL  = p.vs_L_hr9||0;
    var vsR  = p.vs_R_hr9||0;
    var vsLbl = p.hand==='L' ? 'vs RHH' : 'vs LHH';
    var vsHr9 = p.hand==='L' ? vsR : vsL;
    return '<div class="pitcher-name">'+p.name+' <span class="pitcher-hand">'+(p.hand||'R')+'HP</span></div>'+
           '<div class="pitcher-splits">HR/9 <span>'+(hr9>0?hr9.toFixed(2):'--')+'</span> · '+vsLbl+' <span>'+(vsHr9>0?vsHr9.toFixed(2):'--')+'</span></div>';
  }

  // Wind
  var wx = g.weather||{};
  var windHtml = '';
  var windLabel = wx.label||wx.wind_label||'';
  if(windLabel && windLabel!=='Dome'){
    var align = labelToAlign(windLabel);
    var arrow = windArrow(align);
    windHtml = '<div class="wind-col">'+
      '<div class="wind-arrow">'+arrow+'</div>'+
      '<div class="wind-label">'+windLabel+(wx.wind_speed&&wx.wind_speed>0?' '+wx.wind_speed+'mph':'')+'</div>'+
    '</div>';
  } else {
    windHtml = '<div class="wind-col"><div class="wind-label" style="color:var(--muted2)">'+(windLabel||'Dome')+'</div></div>';
  }

  // Proj HRs
  var totals = g.totals||{};
  var proj = totals.total_exp_hr||g.proj_hrs||0;
  var awayProj = totals.away_exp_hr||0;
  var homeProj = totals.home_exp_hr||0;
  // Derive env label from weather mult
  var wxMult = g.weather&&g.weather.mult ? g.weather.mult : 1.0;
  var envLabel = wxMult>=1.08?'Ideal':wxMult>=1.03?'Good':wxMult<=0.92?'Tough':'Normal';
  var envCls = envLabel==='Ideal'?'env-ideal':envLabel==='Good'?'env-good':envLabel==='Tough'?'env-tough':'env-normal';

  // Batter sections
  function buildBatterSection(batters, team, status, side){
    if(!batters||!batters.length) return '<div style="padding:20px;color:var(--muted2);font-size:12px;text-align:center">Lineup TBD</div>';
    var statusHtml = '<div style="padding:6px 10px 2px"><span class="lineup-status status-'+status+'">'+status+'</span></div>';
    var headerHtml = '<div class="batter-header"><span>#</span><span>Batter</span><span style="text-align:right">xSLG</span><span style="text-align:right">Brl%</span><span style="text-align:right">LA</span><span style="text-align:right">HR%</span></div>';
    var show5 = batters.slice(0,5);
    var rest  = batters.slice(5);
    var uid   = 'game'+gi+'_'+side;

    var rowsHtml = show5.map(function(b,bi){ return buildBatterRow(b, bi+1, gi+'_'+side+'_'+bi); }).join('');
    var restHtml = rest.length ? rest.map(function(b,bi){ return buildBatterRow(b, bi+6, gi+'_'+side+'_r'+bi); }).join('') : '';
    var moreHtml = rest.length ? '<div class="more-toggle" onclick="toggleMore(\'more-'+uid+'\',this)">+ '+rest.length+' more</div><div id="more-'+uid+'" style="display:none">'+restHtml+'</div>' : '';

    return statusHtml + headerHtml + rowsHtml + moreHtml;
  }

  return '<div class="game-card">'+
    '<div class="game-grid">'+
      '<div class="game-col game-col-info">'+
        '<div class="game-time">'+time+' ET</div>'+
        '<div class="game-teams">'+g.away+' <span class="vs">@</span> '+g.home+'</div>'+
        '<div class="pitcher-row">'+pitSplits(awayP)+'</div>'+
        '<div style="border-top:1px solid var(--border2);margin:6px 0"></div>'+
        '<div class="pitcher-row">'+pitSplits(homeP)+'</div>'+
      '</div>'+
      '<div class="game-col game-col-proj" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">'+
        '<div class="proj-hrs">'+(proj>0?proj.toFixed(1):'--')+'</div>'+
        '<div class="proj-hrs-label">PROJ HRS</div>'+
        '<div class="proj-hrs-split">'+awayProj.toFixed(1)+' / '+homeProj.toFixed(1)+'</div>'+
        '<span class="env-badge '+envCls+'">'+envLabel+'</span>'+
      '</div>'+
      '<div class="game-col game-col-wind">'+windHtml+'</div>'+
      '<div class="game-col" style="padding:0">'+buildBatterSection(g.away_lineup||g.top_hr_candidates&&g.top_hr_candidates.filter(function(b){return b.team===g.away;}), g.away, awayStatus, 'away')+'</div>'+
      '<div class="game-col" style="padding:0;border-right:none">'+buildBatterSection(g.home_lineup||g.top_hr_candidates&&g.top_hr_candidates.filter(function(b){return b.team===g.home;}), g.home, homeStatus, 'home')+'</div>'+
    '</div>'+
  '</div>';
}

function buildBatterRow(b, order, uid){
  var name = b.name||b.fullName||'';
  var pct  = b.hr_prob||b.model_hr_pct||0;
  var xslg = b.xslg_l8d||0;
  var brl  = b.barrel_pct_season||0;
  var la   = b.la_season||0;
  var isTop25 = top25Names.has(name);
  var pillCls = pctCls(pct) + (isTop25 ? ' top25-pill' : '');

  return '<div class="batter-row" onclick="toggleDetail(\'det-'+uid+'\')" id="row-'+uid+'">'+
    '<span class="bat-order">'+order+'</span>'+
    '<span class="bat-name'+(isTop25?' top25':'')+'">'+name+'</span>'+
    '<span class="stat-val '+(xslg>0?xslgCls(xslg):'muted')+'">'+fmtXslg(xslg)+'</span>'+
    '<span class="stat-val '+(brl>0?brlCls(brl):'muted')+'">'+(brl>0?brl.toFixed(1)+'%':'--')+'</span>'+
    '<span class="stat-val '+(la>0?'':'muted')+'">'+(la>0?la.toFixed(0)+'°':'--')+'</span>'+
    '<span><span class="pct-pill '+pillCls+'">'+(pct>0?pct.toFixed(1)+'%':'--')+'</span></span>'+
  '</div>'+
  '<div class="batter-detail" id="det-'+uid+'">'+buildDetail(b)+'</div>';
}

function buildDetail(b){
  var bd = b.breakdown||b;
  var s  = b.season||{};
  var l  = b.l8d||{};
  var pitP = b.pitcher||{};

  // Stat rows
  var stats = [
    {label:'xSLG L8D', val: l.xslg||b.xslg_l8d||0, key:'xslg_l8d', fmt:fmtXslg},
    {label:'Barrel% Season', val: s.barrel||b.barrel_pct_season||0, key:'barrel_pct_season', fmt:function(v){return v>0?v.toFixed(1)+'%':'--';}},
    {label:'EV L8D', val: l.ev||b.ev_l8d||0, key:'ev_l8d', fmt:function(v){return v>0?v.toFixed(1):'--';}},
    {label:'Bat Speed L8D', val: l.bat_speed||b.bat_speed_l8d||0, key:'bat_speed_l8d', fmt:function(v){return v>0?v.toFixed(1):'--';}},
    {label:'ISO Season', val: s.iso||b.iso_season||0, key:'iso_season', fmt:fmtXslg},
    {label:'ISO vs Hand', val: b.iso_vs_hand||0, key:'iso_vs_hand', fmt:fmtXslg},
    {label:'Pit HR/9', val: b.pit_hr9_season||pitP.hr9||0, key:'pit_hr9_season', fmt:function(v){return v>0?v.toFixed(2):'--';}},
    {label:'Park Factor', val: b.park_factor||bd.park_factor||1.0, key:'park_factor', fmt:function(v){return v>0?v.toFixed(2):'--';}},
  ];

  var statsHtml = stats.map(function(st){
    var med = medians[st.key];
    var tag = '';
    if(med&&st.val&&st.val!==0){
      var above = st.val>med;
      var isPit = st.key.startsWith('pit_');
      var good = isPit&&st.key.includes('hr9') ? above : isPit ? !above : above;
      tag = '<span class="median-tag '+(good?'med-up':'med-dn')+'">'+(above?'↑':'↓')+' med</span>';
    }
    return '<div class="detail-stat-row">'+
      '<span class="detail-stat-label">'+st.label+'</span>'+
      '<div style="display:flex;align-items:center;gap:5px">'+
        '<span class="detail-stat-val">'+st.fmt(st.val)+'</span>'+tag+
      '</div>'+
    '</div>';
  }).join('');

  // Radar scores
  function norm(val,med,cap){ if(!val||!med||val===0)return 50; return Math.min(Math.round(val/med*50),cap||100); }
  function normLow(val,med){ if(!val||!med||val===0)return 50; return Math.min(Math.round(med/val*50),100); }
  function laScore(la){ if(!la||la===0)return 40; return Math.max(0,Math.min(100,Math.round(100-Math.abs(la-26.5)*3.5))); }

  var brl_s=s.barrel||b.barrel_pct_season||0, iso_s=s.iso||b.iso_season||0, ev_s=s.ev||b.ev_season||0;
  var la_s=s.la||b.la_season||0, pull_s=s.pull||b.pull_pct_season||0;
  var xslg_l=l.xslg||b.xslg_l8d||0, ev_l=l.ev||b.ev_l8d||0, brl_l=l.barrel||b.barrel_pct_l8d||0;
  var spd_l=l.bat_speed||b.bat_speed_l8d||0, hh_l=l.hh||b.hard_hit_l8d||0;
  var pit_hr9=b.pit_hr9_season||pitP.hr9||0, pit_hh=b.pit_hard_hit_season||pitP.hard_hit_pct||0;
  var pit_era=b.pit_era_season||pitP.era||0, pit_slg=b.pit_slg_vs_hand||0;
  var pf=b.park_factor||1.0, wx=b.weather_mult||1.0;
  var bat_plat=b.bat_platoon_mult||1.0, pit_plat=b.pit_platoon_mult||1.0;
  var pitch_sc=b.pitch_matchup_score||0, k_l=l.k_pct||b.k_pct_l8d||0;

  var power   = Math.round(norm(brl_s,medians.barrel_pct_season,100)*0.35+norm(iso_s,medians.iso_season,100)*0.30+norm(ev_s,medians.ev_season,100)*0.20+laScore(la_s)*0.08+norm(pull_s,medians.pull_pct_season,100)*0.07);
  var form    = Math.round(norm(xslg_l,medians.xslg_l8d,100)*0.35+norm(ev_l,medians.ev_l8d,100)*0.25+norm(brl_l,medians.barrel_pct_l8d,100)*0.20+norm(spd_l,medians.bat_speed_l8d,100)*0.10+norm(hh_l,medians.hard_hit_l8d,100)*0.05+laScore(0)*0.05);
  var matchup = Math.round(norm(pit_hr9,medians.pit_hr9_season,100)*0.45+norm(pit_hh,medians.pit_hard_hit_season,100)*0.30+normLow(pit_era,medians.pit_era_season)*0.15+norm(pit_slg,0.36,100)*0.10);
  var parkWx  = (pf===1.0&&wx===1.0)?50:Math.round(norm(pf,1.04,100)*0.60+norm(wx,1.00,100)*0.40);
  var disc    = Math.round(normLow(k_l,medians.k_pct_l8d)*0.60+50*0.40);
  var platoon = Math.round(norm(bat_plat,1.0,100)*0.35+norm(pit_plat,1.0,100)*0.35+norm(b.iso_vs_hand||0,medians.iso_vs_hand,100)*0.20+(pitch_sc>0?Math.min(pitch_sc*10+50,100):50)*0.10);

  var scores  = [power,form,matchup,parkWx,disc,platoon];
  var labels  = ['Power','Form','Matchup','Park','Disc','Platoon'];
  var avg     = Math.round(scores.reduce(function(a,c){return a+c;},0)/6);

  // SVG radar
  var size=160,cx=80,cy=80,r=58,n=6;
  function pt(i,v){ var a=(Math.PI*2/n)*i-Math.PI/2,rv=r*(v/100); return[cx+rv*Math.cos(a),cy+rv*Math.sin(a)]; }
  function ptO(i,m){ var a=(Math.PI*2/n)*i-Math.PI/2; return[cx+r*(m||1)*Math.cos(a),cy+r*(m||1)*Math.sin(a)]; }
  var grid='';
  [0.33,0.67,1.0].forEach(function(f){
    var ps=[];for(var i=0;i<n;i++){var p=ptO(i,f);ps.push(p[0]+','+p[1]);}
    grid+='<polygon points="'+ps.join(' ')+'" fill="none" stroke="rgba(44,40,37,0.08)" stroke-width="0.5"/>';
  });
  for(var i=0;i<n;i++){var op=ptO(i);grid+='<line x1="'+cx+'" y1="'+cy+'" x2="'+op[0]+'" y2="'+op[1]+'" stroke="rgba(44,40,37,0.08)" stroke-width="0.5"/>';}
  var dataPts=scores.map(function(v,i){var p=pt(i,v);return p[0]+','+p[1];});
  var fc=avg>=65?'rgba(45,122,58,0.15)':avg>=45?'rgba(200,75,17,0.12)':'rgba(192,57,43,0.12)';
  var sc=avg>=65?'#2D7A3A':avg>=45?'#C84B11':'#C0392B';
  var lbls='';
  labels.forEach(function(lbl,i){
    var op=ptO(i,1.35),dp=pt(i,scores[i]),s=scores[i];
    var dc=s>=65?'#2D7A3A':s>=45?'#C84B11':'#C0392B';
    lbls+='<text x="'+op[0]+'" y="'+(op[1]+3)+'" text-anchor="middle" font-size="7.5" fill="var(--muted)" font-family="DM Sans,sans-serif">'+lbl+'</text>';
    lbls+='<circle cx="'+dp[0]+'" cy="'+dp[1]+'" r="3" fill="'+dc+'"/>';
  });
  var svgStr='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+grid+'<polygon points="'+dataPts.join(' ')+'" fill="'+fc+'" stroke="'+sc+'" stroke-width="1.5"/>'+lbls+'<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="13" fill="'+sc+'" font-weight="700" font-family="DM Serif Display,serif">'+avg+'</text></svg>';

  var strong=scores.filter(function(s){return s>=70;}).length;
  var weak=scores.filter(function(s){return s<=35;}).length;
  var verdict=strong>=4?'Multiple axes aligned — strong spot':strong>=2&&weak===0?'Solid across the board':weak>=2?'Thin case — model found specific edge':'Average spot — no standout signal';

  var scoreCardsHtml = scores.map(function(s,i){
    return '<div class="score-card"><div class="score-card-label">'+labels[i]+'</div><div class="score-card-val '+scoreCls(s)+'">'+s+'</div></div>';
  }).join('');

  return '<div class="detail-grid">'+
    '<div class="detail-stats">'+statsHtml+'</div>'+
    '<div class="radar-wrap">'+
      svgStr+
      '<div class="radar-verdict">'+verdict+'</div>'+
      '<div class="score-cards">'+scoreCardsHtml+'</div>'+
    '</div>'+
  '</div>';
}

function toggleDetail(id){

  el.classList.toggle('open');
  var row = el.previousElementSibling;

function toggleMore(id, el){

  var isOpen = more.style.display!=='none';
  more.style.display = isOpen?'none':'block';
  el.textContent = isOpen ? '+ '+(more.querySelectorAll('.batter-row').length)+' more' : 'Show less';
}

// Wind helpers
function labelToAlign(label){
  var l=(label||'').toLowerCase();
  if(l.includes('out to cf'))return 1.0;if(l.includes('out to lf'))return 0.8;
  if(l.includes('out to rf'))return 0.8;if(l.includes('blowing out'))return 0.6;
  if(l.includes('toward lf'))return 0.3;if(l.includes('toward rf'))return 0.3;
  if(l.includes('calm'))return 0.0;if(l.includes('cross'))return 0.0;
  if(l.includes('slightly in'))return -0.4;if(l.includes('blowing in'))return -1.0;
  return 0;
}
function windArrow(align){
  if(align>=0.7)return'↑';if(align>=0.3)return'↗';
  if(align<=-0.7)return'↓';if(align<=-0.3)return'↙';
  return'→';
}
